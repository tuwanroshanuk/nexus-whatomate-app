name: Apply call permission realtime refresh

on:
  push:
    paths:
      - '.github/workflows/apply-call-permission-realtime.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch realtime permission refresh
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/ui/root.dart')
          s = p.read_text()
          old = """  void _event(RealtimeEvent e) {\n    if ((e.type == 'new_message' || e.type == 'status_update' || e.type == 'reaction_update') &&\n        (e.payload['contact_id']?.toString() == id || e.payload['message']?['contact_id']?.toString() == id)) load(silent: true);\n  }\n"""
          new = """  void _event(RealtimeEvent e) {\n    final eventContactId = e.payload['contact_id']?.toString() ?? e.payload['message']?['contact_id']?.toString();\n    if ((e.type == 'new_message' || e.type == 'status_update' || e.type == 'reaction_update') && eventContactId == id) {\n      load(silent: true);\n      return;\n    }\n    if (e.type == 'call_permission_update' && eventContactId == id) {\n      unawaited(_refreshCallPermission().then((_) { if (mounted) setState(() {}); }));\n    }\n  }\n"""
          if old not in s:
              raise SystemExit('root.dart call event anchor not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/apply-call-permission-realtime.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): refresh call permission state in realtime"
          git push
