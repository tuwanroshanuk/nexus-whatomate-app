name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Flutter Android APK
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Firebase calling configuration
        shell: bash
        run: |
          missing=0
          for name in FIREBASE_PROJECT_ID FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_SENDER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub Actions secret is missing or empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Firebase Android calling configuration is present."
      - name: Generate platform scaffolding
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,windows --org uk.nexuscloud .
          fi
      - name: Apply Flutter feature wiring
        run: python3 tool/flutter_overlay/apply.py
      - name: Apply native Android calling overlay
        run: python3 tool/android_overlay/apply.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatomate-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: whatomate-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
